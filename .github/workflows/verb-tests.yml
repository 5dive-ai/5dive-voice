name: verb-tests

# DIVE-4439. The verb owns one decision that can hurt a user — whether this
# box's voice audio leaves it — and the arms that grade it need root, because
# the whole point of the design is that CHANGING the backend is a root act.
# A developer's own seat usually is not root, so those arms skip locally and
# the skip is printed rather than swallowed. This job is where they actually
# run, on every PR that touches the verb or its manifest.
on:
  pull_request:
    paths:
      - 'voice/bin/voice'
      - 'tests/verb-backend.test.sh'
      - 'voice/bin/5dive-setup-voice'
      - 'voice/lib/**'
      - 'tests/verb-setup.test.sh'
      - 'tests/verb-config.test.sh'
      - 'voice/.claude-plugin/plugin.json'
      - '.github/workflows/verb-tests.yml'
  push:
    branches: [main]
    paths:
      - 'voice/bin/voice'
      - 'tests/verb-backend.test.sh'
      - 'voice/bin/5dive-setup-voice'
      - 'voice/lib/**'
      - 'tests/verb-setup.test.sh'
      - 'tests/verb-config.test.sh'
      - 'voice/.claude-plugin/plugin.json'
      - '.github/workflows/verb-tests.yml'

jobs:
  verb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the verb parses, and the dispatcher could execute it
        run: bash -n voice/bin/voice && bash -n tests/verb-backend.test.sh && test -x voice/bin/voice
      - name: the manifest is valid JSON and declares what voice/bin/voice implements
        run: jq -e '.fivedive.capabilities|index("verb")' voice/.claude-plugin/plugin.json && jq -e . .claude-plugin/marketplace.json >/dev/null
      # Root, so the write-path arms (the refusal without a key, and the
      # config rewrite that must not duplicate the backend= line) actually run.
      - name: the backend switch refuses, writes and reads back correctly (DIVE-4439)
        run: sudo -E bash tests/verb-backend.test.sh
      # NEGATIVE CONTROL. The arms above are only worth running if they can
      # fail. Cut the keyless refusal out of the verb's own text and require
      # the battery to go RED — a suite that passes on the broken verb is a
      # suite that has quietly stopped grading anything.
      - name: ...and they go RED on a verb that drops the keyless refusal
        run: |
          cp voice/bin/voice /tmp/voice.orig
          perl -0pi -e 's/if \[\[ "\$want" == openrouter \]\] && ! voice_openrouter_key >\/dev\/null 2>&1; then/if false; then/' voice/bin/voice
          grep -q 'if false; then' voice/bin/voice || { echo "MUTATION DID NOT LAND — the arm is vacuous"; exit 1; }
          if sudo -E bash tests/verb-backend.test.sh >/dev/null 2>&1; then
            echo "the battery passed on a verb with no keyless refusal — it grades nothing"; cp /tmp/voice.orig voice/bin/voice; exit 1
          fi
          cp /tmp/voice.orig voice/bin/voice
          echo "negative control held: the battery goes red on the mutated verb"

  # DIVE-4875. `5dive voice config` is what the dashboard's settings form reads
  # and writes. The arms that matter are the REFUSALS — a value the manifest does
  # not allow must never reach the config file — and they need root for the same
  # reason the backend arms do.
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the config battery parses
        run: bash -n tests/verb-config.test.sh
      - name: config reads, validates and writes atomically (DIVE-4875)
        run: sudo -E bash tests/verb-config.test.sh
      # NEGATIVE CONTROL: cut the string-value check out of the verb. The battery
      # must go RED, or it is not grading the refusal it claims to.
      - name: ...and it goes RED on a verb that drops the string-value check
        run: |
          cp voice/bin/voice /tmp/voice.orig
          perl -0pi -e 's/\[\[ "\$value" =~ \$CONFIG_STRING_RE \]\] \\\n/true \\\n/' voice/bin/voice
          grep -q 'CONFIG_STRING_RE \]\]' voice/bin/voice && { echo "MUTATION DID NOT LAND — the arm is vacuous"; exit 1; }
          if sudo -E bash tests/verb-config.test.sh >/dev/null 2>&1; then
            echo "the battery passed on a verb that writes any string — it grades nothing"; cp /tmp/voice.orig voice/bin/voice; exit 1
          fi
          cp /tmp/voice.orig voice/bin/voice
          echo "negative control held"
      # NEGATIVE CONTROL (DIVE-4985): drop the FIVEDIVE_JSON_MODE read — the
      # verb as it shipped in 1.3.0, which answered the dashboard's form in text.
      - name: ...and it goes RED on a verb that ignores the dispatcher's JSON mode
        run: |
          cp voice/bin/voice /tmp/voice.orig
          perl -0pi -e 's/  \[\[ "\$\{FIVEDIVE_JSON_MODE:-0\}" == 1 \]\] && json=1\n//' voice/bin/voice
          grep -q '&& json=1' voice/bin/voice && { echo "MUTATION DID NOT LAND — the arm is vacuous"; exit 1; }
          if sudo -E bash tests/verb-config.test.sh >/dev/null 2>&1; then
            echo "the battery passed on a verb that ignores FIVEDIVE_JSON_MODE — it grades nothing"; cp /tmp/voice.orig voice/bin/voice; exit 1
          fi
          cp /tmp/voice.orig voice/bin/voice
          echo "negative control held"

  # DIVE-4495. The property these arms defend is not a behaviour of the verb but
  # a property of the SHIPPED TREE: the plugin carries its own installer, and the
  # command the manifest names is reachable from what `plugin add` puts on a box.
  # It is graded here because it is exactly the kind of thing that regresses by
  # deletion — a payload dropped, a version left unbumped, a manifest reverted to
  # the bare name — and none of those show up in the verb's own behaviour.
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the installer parses, and plugin add would ship it executable
        run: bash -n voice/bin/5dive-setup-voice && test -x voice/bin/5dive-setup-voice && bash -n tests/verb-setup.test.sh
      - name: every shipped payload parses as what it claims to be
        run: |
          for f in voice/lib/*.sh; do bash -n "$f"; done
          python3 -m py_compile voice/lib/whisper-service.py
      # Root, so the preflight arm (a payload missing from the tree must be
      # refused BEFORE step 1 installs anything) actually runs instead of skipping.
      - name: the plugin ships its own installer and the manifest can reach it (DIVE-4495)
        run: sudo -E bash tests/verb-setup.test.sh
      # NEGATIVE CONTROL, and it is the row itself: put the manifest back to the
      # bare `sudo 5dive-setup-voice` — a program written only by 5dive's own box
      # installer — and the battery must go RED. A suite that greens on that is a
      # suite that would not have caught the defect it was written for.
      - name: ...and it goes RED on a manifest that names the program nothing installs
        run: |
          cp voice/.claude-plugin/plugin.json /tmp/plugin.json.orig
          python3 -c "import json,collections;p='voice/.claude-plugin/plugin.json';d=json.load(open(p),object_pairs_hook=collections.OrderedDict);d['fivedive']['setup']['command']='sudo 5dive-setup-voice';json.dump(d,open(p,'w'),indent=2,ensure_ascii=False)"
          grep -q '"command": "sudo 5dive-setup-voice"' voice/.claude-plugin/plugin.json || { echo "MUTATION DID NOT LAND — the arm is vacuous"; exit 1; }
          if sudo -E bash tests/verb-setup.test.sh >/dev/null 2>&1; then
            echo "the battery passed on the manifest that shipped the defect — it grades nothing"; cp /tmp/plugin.json.orig voice/.claude-plugin/plugin.json; exit 1
          fi
          cp /tmp/plugin.json.orig voice/.claude-plugin/plugin.json
          echo "negative control held"
      # The second way this regresses: the installer references a payload that
      # was never added to voice/lib/, and nobody notices until a real box runs it.
      - name: ...and RED when a payload the installer reads is not in the tree
        run: |
          mv voice/lib/whisper-service.py /tmp/ws.bak
          if sudo -E bash tests/verb-setup.test.sh >/dev/null 2>&1; then
            echo "the battery passed with a payload missing — it grades nothing"; mv /tmp/ws.bak voice/lib/whisper-service.py; exit 1
          fi
          mv /tmp/ws.bak voice/lib/whisper-service.py
          echo "negative control held"
